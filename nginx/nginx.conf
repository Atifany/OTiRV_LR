# Замена round-robin на другой алгоритм least_conn нарпимер.
# upstream backend {
#     least_conn;  # <-- алгоритм
#     server order-service:8080;
# }

server {
    listen 80;
    server_name localhost;

    # Встроенный DNS-сервер Docker
    resolver 127.0.0.11 valid=10s ipv6=off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location / {
        # Переменная в proxy_pass => DNS резолвится во время запроса
        set $upstream http://order-service:8080;
		# proxy_pass http://backend; => замена алгоритма на другой upstream
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}