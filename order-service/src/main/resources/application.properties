# Настройки подключения к PostgreSQL (хост 'db' — это имя сервиса в docker-compose)
spring.datasource.url=jdbc:postgresql://db:5432/orders_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Отключение создания таблиц со стороны Hibernate (работают SQL-скрипты миграции)
spring.jpa.hibernate.ddl-auto=none

# Форматированное логирование SQL-запросов в консоль и файл
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# Путь к файлу логов внутри контейнера (эта папка будет проброшена наружу через Volume)
logging.file.name=/app/logs/database-queries.log

# Отключение буферизации записи в файл (логи пишутся на диск мгновенно)
logging.logback.rollingpolicy.immediate-flush=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Заглушение общих логов приложения до уровня ошибок (скроет запуск и инициализацию)
logging.level.root=ERROR

