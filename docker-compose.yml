services:
  # 1. Сервис Базы Данных PostgreSQL
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    restart: unless-stopped

  # 2. Сервис Java-приложения (Spring Boot)
  order-service:
    build: ./order-service
    #container_name: order-service
    #ports:
    #  - "${APP_PORT}:8080"
    depends_on:
      - postgres_db
    volumes:
      - ./app_logs:/app/logs
    restart: unless-stopped

  # 2. Сервис web-dbeaver
  dbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: dbeaver_web
    restart: unless-stopped
    ports:
      - "${DBEAVER_PORT}:8978"
    environment:
      - CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED=false
      - CLOUDBEAVER_APP_PUBLIC_CREDENTIALS_SAVE_ENABLED=true
      - CLOUDBEAVER_APP_ADMIN_CREDENTIALS_SAVE_ENABLED=true
    volumes:
      - ./dbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      - postgres_db
    
  # 3. Прокси-сервер Nginx
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_proxy
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - order-service
    restart: unless-stopped

# Объявляем постоянные именованные тома
volumes:
  pgdata:
  app_logs:
  dbeaver_data:
  nginx_logs:
