services:
  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8081:8080"
    volumes:
      - ./app_logs:/app/logs
    restart: unless-stopped
    networks:
      - pg-net

volumes:
  app_logs:

networks:
  pg-net:
    external: true
    name: pg-lab_patroni-net