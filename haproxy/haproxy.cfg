global
    maxconn 200

defaults
    mode tcp
    timeout client 30m
    timeout server 30m
    timeout connect 4s
    timeout check 3s
    retries 2
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /
    stats refresh 5s

# Запись и чтение — только на текущего лидера
listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

# Чтение — по живым репликам
listen replicas
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008
